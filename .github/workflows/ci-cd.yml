name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Choose the programming language'
        required: true
        default: 'python'
        type: choice
        options:
          - python
          - javascript
          - java
      cloud-provider:
        description: 'Choose the cloud provider'
        required: true
        default: 'azure'
        type: choice
        options:
          - aws
          - azure
          - gcp

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript, java]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Python setup and test
      - name: Set up Python
        if: matrix.language == 'python' && github.event.inputs.language == 'python'
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        if: matrix.language == 'python' && github.event.inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r app/python/requirements.txt

      - name: Lint Python code
        if: matrix.language == 'python' && github.event.inputs.language == 'python'
        run: |
          pip install pylint
          pylint app/python/*.py

      - name: Run Python tests
        if: matrix.language == 'python' && github.event.inputs.language == 'python'
        env:
          PYTHONPATH: app/python
        run: |
          python -m unittest discover -s app/python/tests

      - name: Upload Python Build Artifact
        if: matrix.language == 'python' && github.event.inputs.language == 'python'
        uses: actions/upload-artifact@v2
        with:
          name: python-build-artifact
          path: app/python/**/*

      # JavaScript setup and test
      - name: Set up Node.js
        if: matrix.language == 'javascript' && github.event.inputs.language == 'javascript'
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install JavaScript dependencies
        if: matrix.language == 'javascript' && github.event.inputs.language == 'javascript'
        run: npm install
        working-directory: app/javascript

      - name: Lint JavaScript code
        if: matrix.language == 'javascript' && github.event.inputs.language == 'javascript'
        run: npm run lint
        working-directory: app/javascript

      - name: Run JavaScript tests
        if: matrix.language == 'javascript' && github.event.inputs.language == 'javascript'
        run: npm test
        working-directory: app/javascript

      - name: Upload JavaScript Build Artifact
        if: matrix.language == 'javascript' && github.event.inputs.language == 'javascript'
        uses: actions/upload-artifact@v2
        with:
          name: javascript-build-artifact
          path: app/javascript/**/*

      # Java setup and test
      - name: Set up JDK
        if: matrix.language == 'java' && github.event.inputs.language == 'java'
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Build Java project
        if: matrix.language == 'java' && github.event.inputs.language == 'java'
        run: mvn clean package
        working-directory: app/java

      - name: Run Java tests
        if: matrix.language == 'java' && github.event.inputs.language == 'java'
        run: mvn test
        working-directory: app/java

      - name: Upload Java Build Artifact
        if: matrix.language == 'java' && github.event.inputs.language == 'java'
        uses: actions/upload-artifact@v2
        with:
          name: java-build-artifact
          path: app/java/target/**/*

  deploy_aws:
    needs: test
    if: github.event.inputs.cloud-provider == 'aws'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download Build Artifact
        uses: actions/download-artifact@v2
        with:
          name: ${{ github.event.inputs.language }}-build-artifact
          path: ./build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          cli_config_credentials_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/aws

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform/aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Extract IP
        id: extract_ip
        run: echo "::set-output name=ip::$(cat ./terraform/aws/ip_address.txt)"

      - name: Create Ansible inventory file
        run: |
          echo "[app_server]" > ansible/inventory
          echo "app_server ansible_host=${{ steps.extract_ip.outputs.ip }}" >> ansible/inventory

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Ansible playbook
        run: ansible-playbook -i ansible/inventory ansible/playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

  deploy_azure:
    needs: test
    if: github.event.inputs.cloud-provider == 'azure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download Build Artifact
        uses: actions/download-artifact@v2
        with:
          name: ${{ github.event.inputs.language }}-build-artifact
          path: ./build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          cli_config_credentials_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/azure

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform/azure
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Extract IP
        id: extract_ip
        run: echo "::set-output name=ip::$(cat ./terraform/azure/ip_address.txt)"

      - name: Create Ansible inventory file
        run: |
          echo "[app_server]" > ansible/inventory
          echo "app_server ansible_host=${{ steps.extract_ip.outputs.ip }}" >> ansible/inventory

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Ansible playbook
        run: ansible-playbook -i ansible/inventory ansible/playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

  deploy_gcp:
    needs: test
    if: github.event.inputs.cloud-provider == 'gcp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download Build Artifact
        uses: actions/download-artifact@v2
        with:
          name: ${{ github.event.inputs.language }}-build-artifact
          path: ./build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          cli_config_credentials_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/gcp

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform/gcp
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}

      - name: Extract IP
        id: extract_ip
        run: echo "::set-output name=ip::$(cat ./terraform/gcp/ip_address.txt)"

      - name: Create Ansible inventory file
        run: |
          echo "[app_server]" > ansible/inventory
          echo "app_server ansible_host=${{ steps.extract_ip.outputs.ip }}" >> ansible/inventory

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Ansible playbook
        run: ansible-playbook -i ansible/inventory ansible/playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
